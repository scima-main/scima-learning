[pytest]
testpaths = ui
addopts = -ra --strict-markers --browser chromium
markers =
    smoke: minimal "does the page render" checks — run these first
    nav: navigation, routing, drawer, command palette, redirect stubs
    home: home/dashboard view
    study: study picker / session flows (reveal, rating, modes)
    decks: deck + folder CRUD, deck detail
    library: library (sources) view
    analytics: analytics + quests views
    settings: settings view (theme, toggles, goal, data)
    storage: localStorage seeding, sanitization, persistence
    responsive: display-dimension matrix (viewports, touch devices, DPI)
    content: content-integrity checkers (overflow, markers, rich text, unicode)
    community: community view against a mocked /api/v1 (no backend needed)
    tour: first-run guided tutorial
    slow: noticeably slower than the rest of the suite
