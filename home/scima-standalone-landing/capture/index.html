<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIMA Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../app/dashboard.css">
  <!--
    SCIMA Learning — Capture route: Capture + Library (multi-page route
    build; see the landing index.html header for the full map). The
    sources → cards pipeline in one document: import/read a source in the
    Library, then create cards from it (or Quick Add / AI Generate) without
    a page load between; "Go to Library" from an empty citation picker is
    an in-page switch. Manifest notes: this is the only route that imports
    files, so it carries process-shim.js (must precede the epub bundle — it
    polyfills the Node `process` global the bundled path-resolution code
    expects), fflate (Library "Import" .zip and exportSourceWithBookmarks),
    and the EPUB/MOBI parser bundles. dashboard-decks.js provides the
    citation pickers/viewer, the chunked-blob helpers and
    openCreateDeckModal() that capture/library flows call. pdf.min.js is
    still lazy-loaded on demand via assetUrl(). KaTeX is NOT loaded —
    capture previews are plain text and the reader shows source HTML as
    authored; created cards get their LaTeX rendered on the Study route.
    Default view for a bare /capture/ URL is Capture; the Library tab is
    #library.
  -->
</head>
<body>
  <div id="stripe"></div>
  <button id="info-btn" title="About this page" aria-label="Page help">i</button>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="logo">
          <div id="logo-icon">✦</div>
          <div>
            <div id="logo-name">SCIMA Learning</div>
            <div id="logo-sub">Adaptive Learning</div>
          </div>
        </div>
        <div id="xp-bar-wrap">
          <span id="xp-level">Lv.1</span>
          <div id="xp-track"><div id="xp-fill"></div></div>
          <span id="xp-label">0/500</span>
        </div>
      </div>
      <div id="pinned-decks"></div>
      <nav id="nav"></nav>
      <div id="sidebar-footer">
        <div id="footer-stats"></div>
      </div>
    </aside>
    <main id="main">
      <div id="view-capture"   class="view"></div>
      <div id="view-library"   class="view"></div>
    </main>
  </div>

  <div id="modal-backdrop" class="hidden">
    <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div id="modal-header">
        <span id="modal-title"></span>
        <button id="modal-close" aria-label="Close dialog">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="cmd-backdrop" class="hidden">
    <div id="cmd-box" role="dialog" aria-modal="true" aria-label="Command palette" tabindex="-1">
      <div id="cmd-input-row">
        <span class="cmd-icon">⌘</span>
        <input id="cmd-input" placeholder="Quick action… (Esc to close)" aria-label="Search commands" role="combobox" aria-expanded="true" aria-controls="cmd-list" autocomplete="off">
        <span class="cmd-esc">ESC</span>
      </div>
      <div id="cmd-list" role="listbox" aria-label="Commands"></div>
    </div>
  </div>

  <div id="toast" class="hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="cmd-hint">
    <span class="cmd-key">⌘K</span> Command Palette
  </div>

  <!-- Route identity for the multi-page router (dashboard-core.js reads
       this before it evaluates PAGE_VIEWS/ROOT_REL). `root` is the
       relative path from this page back to the landing folder. -->
  <script>window.SCIMA_PAGE = { id: 'capture', root: '../', views: ['capture', 'library'] };</script>
  <script src="../lib/process-shim.js"></script>
  <script src="../lib/fflate.umd.js"></script>
  <script src="../lib/epub-parser.bundle.js"></script>
  <script src="../lib/mobi-parser.bundle.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../shared/shared.js"></script>
  <script src="../shared/srs-core.js"></script>
  <script src="../shared/srs.js"></script>
  <script src="../shared/translate-shared.js"></script>
  <script src="../app/dashboard-core.js"></script>
  <script src="../app/dashboard-blobstore.js"></script>
  <script src="../app/dashboard-decks.js"></script>
  <script src="../app/dashboard-library.js"></script>
  <script src="../app/dashboard-capture.js"></script>
  <script src="../app/dashboard-analytics.js"></script>
  <script src="../app/dashboard-onboarding.js"></script>
  <script src="../app/dashboard-bootstrap.js"></script>
</body>
</html>
