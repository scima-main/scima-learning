<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIMA Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard/dashboard.css">
  <!--
    SCIMA Learning — Mark Tracker (multi-page site build; see index.html's
    header for the page map). All six tracker views live on this one page
    and are still stubs (dashboard-stubs.js renders the honest "isn't in
    this build yet" placeholder, same copy as before) until the real
    dashboard-tracker.js is ported in a later phase — this is the
    "separate index.html planned for it" from the old build's notes, now
    realized as tracker.html. Switching between the six tracker tabs is an
    in-page render; the hash (#tracker-logmarks etc.) selects the initial
    one, so old index.html#tracker-* deep links are redirected here by
    bootstrap's init().
  -->
</head>
<body>
  <div id="stripe"></div>
  <button id="info-btn" title="About this page" aria-label="Page help">i</button>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="logo">
          <div id="logo-icon">✦</div>
          <div>
            <div id="logo-name">SCIMA Learning</div>
            <div id="logo-sub">Adaptive Learning</div>
          </div>
        </div>
        <div id="xp-bar-wrap">
          <span id="xp-level">Lv.1</span>
          <div id="xp-track"><div id="xp-fill"></div></div>
          <span id="xp-label">0/500</span>
        </div>
      </div>
      <div id="pinned-decks"></div>
      <nav id="nav"></nav>
      <div id="sidebar-footer">
        <div id="footer-stats"></div>
      </div>
    </aside>
    <main id="main">
      <div id="view-tracker-overview"        class="view tracker-view"></div>
      <div id="view-tracker-logmarks"        class="view tracker-view"></div>
      <div id="view-tracker-subjects"        class="view tracker-view"></div>
      <div id="view-tracker-history"         class="view tracker-view"></div>
      <div id="view-tracker-managesubjects"  class="view tracker-view"></div>
      <div id="view-tracker-trackersettings" class="view tracker-view"></div>
    </main>
  </div>

  <div id="modal-backdrop" class="hidden">
    <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div id="modal-header">
        <span id="modal-title"></span>
        <button id="modal-close" aria-label="Close dialog">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="cmd-backdrop" class="hidden">
    <div id="cmd-box" role="dialog" aria-modal="true" aria-label="Command palette" tabindex="-1">
      <div id="cmd-input-row">
        <span class="cmd-icon">⌘</span>
        <input id="cmd-input" placeholder="Quick action… (Esc to close)" aria-label="Search commands" role="combobox" aria-expanded="true" aria-controls="cmd-list" autocomplete="off">
        <span class="cmd-esc">ESC</span>
      </div>
      <div id="cmd-list" role="listbox" aria-label="Commands"></div>
    </div>
  </div>

  <div id="toast" class="hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="cmd-hint">
    <span class="cmd-key">⌘K</span> Command Palette
  </div>

  <!-- Page identity for the multi-page router (dashboard-core.js reads
       this before it evaluates PAGE_VIEWS). -->
  <script>window.SCIMA_PAGE = { file: 'tracker.html', views: ['tracker-overview', 'tracker-logmarks', 'tracker-subjects', 'tracker-history', 'tracker-managesubjects', 'tracker-trackersettings'] };</script>
  <script src="shared/theme.js"></script>
  <script src="shared/shared.js"></script>
  <script src="shared/srs-core.js"></script>
  <script src="shared/srs.js"></script>
  <script src="shared/translate-shared.js"></script>
  <script src="dashboard/dashboard-core.js"></script>
  <script src="dashboard/dashboard-analytics.js"></script>
  <script src="dashboard/dashboard-onboarding.js"></script>
  <script src="dashboard/dashboard-stubs.js"></script>
  <script src="dashboard/dashboard-bootstrap.js"></script>
</body>
</html>
