<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIMA Learning — Adaptive Flashcard Study</title>
  <meta name="description" content="Adaptive flashcard studying in your browser: spaced-repetition review, written quizzes, a reading library and analytics. No account — decks stay on your device.">
  <link rel="icon" type="image/svg+xml" href="assets/svg/logo.svg">
  <link rel="canonical" href="https://study.scima-net.com/">
  <meta property="og:site_name" content="SCIMA Learning">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SCIMA Learning — Adaptive Flashcard Study">
  <meta property="og:description" content="Adaptive flashcard studying in your browser: spaced-repetition review, written quizzes, a reading library and analytics. No account — decks stay on your device.">
  <meta property="og:url" content="https://study.scima-net.com/">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0B0F14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/katex/katex.min.css">
  <link rel="stylesheet" href="app/dashboard.css">
  <!--
    SCIMA Learning — Home. Six pages, six nav tabs.

    The eight flashcard tabs became six pages by merging Capture into the
    Decks page and Quests into the Analytics page (each merged pair switches
    in-page via a tab bar and #capture / #quests deep links); the Mark
    Tracker's six stub tabs/views/route were removed outright. The nav is a
    collapsible drawer: at rest the ≡ logo mark (the old ✦ tile, now a
    floating circle with hover/active touch states) is the only chrome;
    opening slides the drawer in from the left over a dim backdrop (modal
    pattern: click-outside / Esc closes, focus returns to the mark) while
    the drawer's labels fade in. Slide is transform-only, fades are
    opacity-only; .power-saving and prefers-reduced-motion disable motion.

      /             Home + #community          Community lives in THIS
                                               document at the #community
                                               hash (the old standalone
                                               /community/ mount is
                                               deprecated). Entry is the
                                               🌐 nav tab (no in-page
                                               selector bar) or a shareable
                                               /#community/&lt;deckId&gt; deep
                                               link, which opens that deck's
                                               detail screen on arrival.
                                               Adds dashboard-community.js
                                               to this slice
      /decks/       Decks                      + KaTeX/mhchem card previews;
                                               ✨ AI Capture lives in the
                                               "+ New Deck" modal
      /study/       Study                      + KaTeX/mhchem card faces
      /library/     Library                    + fflate, EPUB/MOBI parsers,
                                               process-shim
      /analytics/   Analytics + Quests         + dashboard-library.js for the
                                               reading-time breakdown
      /settings/    Settings                   + fflate (Export/Import zip)

    Static redirect stubs keep old URLs working under both mount families:
    /capture/ → /decks/ (view retired), /insights/ → /analytics/,
    /tracker/ → /.

    The backend serves the landing folder both at the domain root (canonical,
    backend/app/main.py's "/" mount) and at /dashboard/ (legacy mount — kept
    for old bookmarks and because community/index.html loads
    /dashboard/shared/theme.js root-absolute). Every reference below is
    RELATIVE (scripts, styles, lazy pdf.js via assetUrl(), cross-route links),
    so the same files work under both prefixes. Shared assets stay at the
    landing root; route directories contain only their index.html (or a
    redirect stub).

    Cross-page seams live in app/dashboard-core.js (VIEW_ROUTES/PAGE_VIEWS,
    navigate()/renderView() redirects, the sessionStorage nav handoff,
    openDeckDetail()'s redirecting fallback, the nav drawer) and
    app/dashboard-bootstrap.js (handoff + per-route view-memory restore in
    init(), the pagehide flush/snapshot, the once-per-session achievement
    toast).

    Load order within each page follows the old single-page rules:
    process-shim.js before the epub parser bundle; translate-shared.js before
    dashboard-core.js; dashboard-core.js first of the app/*.js;
    dashboard-blobstore.js after core and before decks/library;
    dashboard-bootstrap.js last. pdf.min.js / pdf.worker.min.js are still
    loaded on demand via assetUrl(), never eagerly here.
  -->
</head>
<body>
<h1 class="seo-h1">SCIMA Learning — adaptive flashcard study dashboard</h1>
<noscript><div style="max-width:560px;margin:48px auto;padding:20px 24px;font-family:system-ui,sans-serif;line-height:1.6;border:1px solid #ccc;border-radius:12px"><strong>SCIMA Learning</strong> is a private, client-side study app: your decks, review sessions and progress live entirely in this browser — nothing is uploaded. Enable JavaScript to create decks, study with spaced repetition, read sourced texts and track analytics. <a href="/about/">About &amp; changelog</a> · <a href="/sitemap.xml">Site map</a> · <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a> · <a href="/cookies/">Cookies</a>.</div></noscript>
  <div id="stripe"></div>
  <button id="logo-icon" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="sidebar" title="Menu">≡</button>
  <button id="info-btn" title="About this page" aria-label="Page help">i</button>
  <div id="nav-backdrop"></div>
  <aside id="sidebar" aria-hidden="true" tabindex="-1">
    <div id="sidebar-header">
      <div id="logo">
        <div>
          <div id="logo-name">SCIMA Learning</div>
          <div id="logo-sub">Adaptive Learning</div>
        </div>
      </div>
      <div id="xp-bar-wrap">
        <span id="xp-level">Lv.1</span>
        <div id="xp-track"><div id="xp-fill"></div></div>
        <span id="xp-label">0/500</span>
      </div>
    </div>
    <div id="pinned-decks"></div>
    <nav id="nav"></nav>
    <div id="sidebar-footer">
      <div id="footer-stats"></div>
    </div>
  </aside>
  <div id="app">
    <main id="main">
      <div id="page-tabs"></div>
      <div id="page-tabs-float" aria-hidden="true"></div>
      <div id="view-home"      class="view"></div>
      <!-- Community view container: empty and hidden unless #community is
           the active view (nav tab is the only entry point; the in-page
           selector bar is not rendered on this page). -->
      <div id="view-community" class="view"></div>
    </main>
  </div>

  <div id="modal-backdrop" class="hidden">
    <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div id="modal-header">
        <span id="modal-title"></span>
        <button id="modal-close" aria-label="Close dialog">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="cmd-backdrop" class="hidden">
    <div id="cmd-box" role="dialog" aria-modal="true" aria-label="Command palette" tabindex="-1">
      <div id="cmd-input-row">
        <span class="cmd-icon">⌘</span>
        <input id="cmd-input" placeholder="Quick action… (Esc to close)" aria-label="Search commands" role="combobox" aria-expanded="true" aria-controls="cmd-list" autocomplete="off">
        <span class="cmd-esc">ESC</span>
      </div>
      <div id="cmd-list" role="listbox" aria-label="Commands"></div>
    </div>
  </div>

  <div id="toast" class="hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="cmd-hint">
    <span class="cmd-key">⌘K</span> Command Palette
  </div>

  <!-- Page identity for the multi-page router (app/dashboard-core.js
       reads this before it evaluates PAGE_VIEWS/ROOT_REL). `root` is
       the relative path from this page back to the landing folder. -->
  <script>window.SCIMA_PAGE = { id: 'home', root: '', views: ['home', 'community'] };</script>
  <script src="shared/theme.js"></script>
  <script src="shared/shared.js"></script>
  <script src="shared/icons.js"></script>
  <script src="shared/scima-schema.js"></script>
  <script src="shared/srs-core.js"></script>
  <script src="shared/adaptive-core.js"></script>
  <script src="shared/srs.js"></script>
  <script src="shared/translate-shared.js"></script>
  <script src="app/dashboard-core.js"></script>
  <script src="app/dashboard-home.js"></script>
  <script src="app/dashboard-community.js"></script>
  <script src="app/dashboard-analytics.js"></script>
  <script src="app/dashboard-onboarding.js"></script>
  <script src="app/dashboard-bootstrap.js"></script>
</body>
</html>
